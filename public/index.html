<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GlassStream Pro — Video Platform</title>
<link rel="stylesheet" href="/styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23101014'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ff9000'/%3E%3C/svg%3E" />
</head>
<body>
<div class="aurora" aria-hidden="true">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<header class="nav" id="nav">
  <button class="nav-logo" data-view="home" aria-label="GlassStream Pro home">
    <span class="logo-dot"></span>GLASSSTREAM
  </button>
  <nav class="nav-tabs glass" id="navTabs">
    <button class="tab active" data-view="home">Home</button>
    <button class="tab" data-view="feed">Feed</button>
    <button class="tab" data-view="library">My Library</button>
  </nav>
  <div class="nav-search glass">
    <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14Z"/></svg>
    <input id="search" type="text" placeholder="Search videos" autocomplete="off" />
  </div>
  <div class="nav-user">
    <button class="icon-btn glass" id="btnUpload" aria-label="Upload">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M11 6.83 9.41 8.41 8 7l4-4 4 4-1.41 1.41L13 6.83v6.34a1 1 0 1 1-2 0V6.83ZM6 18v2h12v-2h2v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2h2Z"/></svg>
    </button>
    <div id="userBox"></div>
  </div>
</header>

<main id="app"></main>

<footer class="footer">
  <span class="footer-dot"></span>
  GlassStream Pro — zero-dependency full-stack · scrypt auth · streaming with Range · no external assets
</footer>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal glass" id="modal">
    <button class="icon-btn modal-close" id="modalClose" aria-label="Close">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
